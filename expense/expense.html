<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Management</title>

<link rel="stylesheet" href="expense.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<header>

<h1>💰 Expense Management</h1>

<button id="addExpenseBtn">

<i class="fa-solid fa-plus"></i>

Add Expense

</button>

</header>

<section class="summary">

    <div class="summary-card">
        <h3>Total Expenses</h3>
        <h2 id="totalExpense">₹0</h2>
    </div>

    <div class="summary-card">
        <h3>Total Records</h3>
        <h2 id="totalRecords">0</h2>
    </div>

</section>

<div class="toolbar">

<input
type="text"
id="searchExpense"
placeholder="Search Expense">

<select id="categoryFilter">

<option>All Categories</option>

<option>Seeds</option>

<option>Fertilizer</option>

<option>Labor</option>

<option>Fuel</option>

<option>Machinery</option>

</select>

</div>

<section class="expense-grid" id="expenseGrid">
    <!-- Expense Modal -->

<div class="modal" id="expenseModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add Expense</h2>
            <span id="closeModal">&times;</span>
        </div>

        <input type="text" id="expenseTitle" placeholder="Expense Title">

        <input type="number" id="expenseAmount" placeholder="Amount">

        <select id="expenseCategory">

            <option value="">Select Category</option>
            <option>Seeds</option>
            <option>Fertilizer</option>
            <option>Labor</option>
            <option>Fuel</option>
            <option>Machinery</option>

        </select>

        <input type="date" id="expenseDate">

        <textarea id="expenseNote" placeholder="Notes"></textarea>

        <button id="saveExpense">

            Save Expense

        </button>

    </div>

</div>

</section>

</div>

<script src="expense.js"></script>

</body>

</html>
