<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Management | AgriLedger</title>

    <link rel="stylesheet" href="crop.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <h1>🌾 Crop Management</h1>

            <button id="addCropBtn">
                <i class="fa-solid fa-plus"></i>
                Add Crop
            </button>

        </header>

        <!-- Search & Filter -->
        <div class="toolbar">

            <input type="text" placeholder="Search crop...">

            <select>
                <option>All Seasons</option>
                <option>Kharif</option>
                <option>Rabi</option>
                <option>Zaid</option>
            </select>

        </div>

        <!-- Add Crop Modal -->

<div class="modal" id="cropModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Add New Crop</h2>

            <span id="closeModal">&times;</span>

        </div>

        <input type="text" id="cropName" placeholder="Crop Name">

        <input type="text" id="cropArea" placeholder="Area (Acres)">

        <input type="text" id="cropSeason" placeholder="Season">

        <input type="text" id="cropYield" placeholder="Expected Yield">

        <button id="saveCrop">
            Save Crop
        </button>

    </div>

</div>

        <!-- Crop Cards -->
        <section class="crop-grid" id="cropGrid">

            <div class="crop-card">

    <div class="card-top">

        <div class="crop-icon">
            🌾
        </div>

        <span class="status active">
            Growing
        </span>

    </div>

    <h2>Wheat</h2>

    <div class="info">

        <p><i class="fa-solid fa-location-dot"></i> Area : 5 Acres</p>

        <p><i class="fa-solid fa-calendar"></i> Season : Rabi</p>

        <p><i class="fa-solid fa-chart-line"></i> Expected Yield : 20 Tons</p>

    </div>

    <div class="progress-box">

        <div class="progress-text">

            <span>Growth</span>

            <span>70%</span>

        </div>

        <div class="progress">

            <div class="progress-fill"></div>

        </div>

    </div>

    <div class="buttons">

        <button class="edit">

            <i class="fa-solid fa-pen"></i>

            Edit

        </button>

        <button class="delete">

            <i class="fa-solid fa-trash"></i>

            Delete

        </button>

    </div>

</div>

        </section>

    </div>

    <script src="crop.js"></script>

</body>

</html>
